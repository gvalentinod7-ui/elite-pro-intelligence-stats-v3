name: Build Elite-Pro Intelligence Stats FIRE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer Android API 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decompresser Elite-Pro V3
        run: |
          mkdir -p buildsrc

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun fichier ZIP trouve"
            exit 1
          fi

          echo "ZIP trouve : $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d buildsrc

          PROJECT_DIR=$(find buildsrc -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : projet Android introuvable dans le ZIP"
            find buildsrc -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Projet Android trouve : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Contenu du projet :"
          ls -la "$PROJECT_DIR"

      - name: Adapter projet Android 16
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/g' \
          "$PROJECT_DIR/app/build.gradle.kts"

          sed -i 's/targetSdk = 37/targetSdk = 36/g' \
          "$PROJECT_DIR/app/build.gradle.kts"

          echo "Configuration Android :"
          grep -n "compileSdk" "$PROJECT_DIR/app/build.gradle.kts" || true
          grep -n "targetSdk" "$PROJECT_DIR/app/build.gradle.kts" || true
          grep -n "minSdk" "$PROJECT_DIR/app/build.gradle.kts" || true

      - name: Installer Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Verifier Gradle
        run: |
          gradle --version
          echo "Projet utilise : $PROJECT_DIR"

      - name: Compiler APK Android
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Localiser APK
        run: |
          echo "APK generes :"
          find "$PROJECT_DIR/app/build/outputs" -type f -name "*.apk" -print

      - name: Preparer APK final
        run: |
          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERREUR : APK non trouve"
            exit 1
          fi

          cp "$APK_FILE" \
            "ELITE-PRO-INTELLIGENCE-STATS-FIRE-V3.apk"

          ls -lh "ELITE-PRO-INTELLIGENCE-STATS-FIRE-V3.apk"

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: ELITE-PRO-INTELLIGENCE-STATS-FIRE-V3
          path: ELITE-PRO-INTELLIGENCE-STATS-FIRE-V3.apk
          if-no-files-found: error
