name: Build Elite-Pro Intelligence Stats FIRE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer API Android
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Installer Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Decompresser Elite-Pro V3
        run: |
          mkdir -p buildsrc
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Aucun fichier ZIP trouve"
            exit 1
          fi

          echo "ZIP trouve : $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d buildsrc

          PROJECT_DIR=$(find buildsrc -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Projet Android introuvable dans le ZIP"
            exit 1
          fi

          echo "Projet Android : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compiler APK Android
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Preparer APK final
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
          "ELITE-PRO-INTELLIGENCE-STATS-FIRE-V3.apk"

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: ELITE-PRO-INTELLIGENCE-STATS-FIRE-V3
          path: ELITE-PRO-INTELLIGENCE-STATS-FIRE-V3.apk
          if-no-files-found: error
