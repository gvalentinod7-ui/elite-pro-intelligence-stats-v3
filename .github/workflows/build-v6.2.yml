name: Build Elite-Pro Pulse Intelligence V6.2 FIRE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer Android API 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decompresser Elite-Pro V6.2
        run: |
          mkdir -p buildsrc-v62
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*V6.2*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : fichier V6.2 ZIP introuvable"
            exit 1
          fi

          echo "ZIP V6.2 : $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d buildsrc-v62
          PROJECT_DIR=$(find buildsrc-v62 -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : projet Android V6.2 introuvable"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projet V6.2 : $PROJECT_DIR"

      - name: Installer Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Compiler Elite-Pro V6.2
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Preparer APK V6.2
        run: |
          APK_FILE=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERREUR : APK V6.2 introuvable"
            exit 1
          fi
          cp "$APK_FILE" "ELITE-PRO-PULSE-INTELLIGENCE-V6.2-FIRE.apk"
          ls -lh "ELITE-PRO-PULSE-INTELLIGENCE-V6.2-FIRE.apk"

      - name: Publier APK V6.2
        uses: actions/upload-artifact@v4
        with:
          name: ELITE-PRO-PULSE-INTELLIGENCE-V6.2-FIRE
          path: ELITE-PRO-PULSE-INTELLIGENCE-V6.2-FIRE.apk
          if-no-files-found: error
